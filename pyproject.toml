[project]
name = "agroia"
version = "0.1.0"
description = "Aplicacion Streamlit para gestion agropecuaria"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.0.3",
    "plotly==6.8.0",
    "pulp==3.3.2",
    "streamlit==1.58.0",
    "supabase==2.31.0",
    "yfinance==1.4.1",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.0.3", "ruff>=0.15.17"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # import sorting
    "UP", # pyupgrade
    "B",  # bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
