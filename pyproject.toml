[project]
name = "agroia"
version = "0.1.0"
description = "Aplicacion Streamlit para gestion agropecuaria"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.0.3",
    "plotly==6.8.0",
    "pulp==3.3.2",
    "streamlit==1.58.0",
    "supabase==2.31.0",
    "yfinance==1.4.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
